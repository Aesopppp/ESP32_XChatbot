name: Build ESP-VoCat

on:
  workflow_dispatch:
  push:
    branches: [dev/esp-vocat-v1.2, main, 'ci/**']
  pull_request:
    branches: [dev/esp-vocat-v1.2, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test build tooling and private config generators
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python tools/run_host_tests.py
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build VoCat with Chinese UI and configured wake word
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          # Public CI has no private token or Wi-Fi presets. This verifies compilation only.
          python scripts/build.py espressif/esp-vocat --name esp-vocat --language zh-CN --wake-word wn9_nihaoxiaoyi_tts2
      - name: Upload test firmware (requires local ACOS configuration to use)
        uses: actions/upload-artifact@v4
        with:
          name: vocat-build-check-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
